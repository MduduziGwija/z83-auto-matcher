name: Deploy to GitHub Pages
on:
  push:
    branches: [main, claude/new-session-l5ug7w]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  # One group per branch, so a push to `main` cannot cancel the run on the default branch (which does the deploy).
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    # GitHub Pages only accepts deployments from the repo's default branch.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
